<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robozinho Universitas — 1º Ano</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#eef7ff,#fff8df);color:#17324d}header{background:linear-gradient(135deg,#0d4f8d,#176dcc,#54a9ef);color:#fff;padding:16px}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:clamp(26px,5vw,42px)}header p{margin:4px 0 0;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#ffffff26;border:2px solid #ffffff40;border-radius:15px;padding:8px 11px;font-weight:900}.progress{height:12px;background:#d8e7f4}#bar{height:100%;width:0;background:linear-gradient(90deg,#ffd84d,#25a45b);transition:.25s}main{max-width:1100px;margin:18px auto;padding:0 14px 30px}.panel{background:#fff;border:3px solid #d5e7f6;border-radius:25px;padding:20px;box-shadow:0 10px 28px #145da020}.center{text-align:center}h2{color:#145da0;margin:5px 0}.lead{font-size:20px;font-weight:900;line-height:1.35;max-width:850px;margin:10px auto}.studentGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;max-width:950px;margin:16px auto}.student{padding:13px;color:#fff;background:#2f80ed;border:4px solid transparent;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer}.student.sel{border-color:#10263d}input{width:min(600px,95%);padding:13px;border:3px solid #95c8f0;border-radius:14px;font-size:20px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:16px;cursor:pointer;background:#145da0;color:#fff}.green{background:#259b57}.yellow{background:#ffd84d;color:#4b3a00}.light{background:#fff;color:#145da0;border:3px solid #8fc3ec}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:13px}.gamegrid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,.85fr);gap:18px}@media(max-width:820px){.gamegrid{grid-template-columns:1fr}}.boardWrap{overflow:auto;padding:8px}.board{display:grid;gap:7px;justify-content:center;min-width:max-content}.cell{width:70px;height:70px;border-radius:13px;background:#fff;border:2px solid #b7cce0;box-shadow:0 4px 0 #b7c8d7;position:relative;display:flex;align-items:center;justify-content:center;font-size:30px}.block{background:#606c78;box-shadow:none}.target{position:absolute;inset:8px;border-radius:50%;border:4px solid #ffc107;background:#fff8cf}.target.on{background:#ffd84d;box-shadow:0 0 18px #ffc107}.robot{position:relative;z-index:3;font-size:35px}.side{background:#f8fbfe;border:2px solid #d6e8f7;border-radius:18px;padding:14px}.cmdButtons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.cmd{padding:10px;background:#fff;border:3px solid #9ac8ef;color:#173b62;border-radius:13px;font-weight:900;cursor:pointer}.program{min-height:80px;background:#10253d;color:#fff;border-radius:14px;padding:10px;display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.token{background:#294967;border-radius:9px;padding:7px 9px;font-weight:900}.rep{background:#b7791f}.feedback{min-height:54px;margin-top:12px;border-radius:13px;padding:11px;font-weight:900}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.help{font-size:13px;color:#56697c;line-height:1.4;margin-top:9px}.final{background:#fff8d8;border:4px solid #ffd84d;border-radius:20px;padding:18px}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}th,td{border:1px solid #cbd5e1;padding:7px;text-align:left}th{background:#145da0;color:#fff}@media(max-width:600px){.cell{width:56px;height:56px;font-size:24px}.panel{padding:14px 9px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🤖 Robozinho Universitas</h1><p>1º Ano • Programação Visual • 15 fases</p></div><div class="stats"><div class="badge">Fase <span id="phaseN">1</span>/15</div><div class="badge">⭐ <span id="starsEl">0</span></div><div class="badge">Tentativas <span id="triesEl">0</span></div></div></div></header>
<div class="progress"><div id="bar"></div></div>
<main><section id="app" class="panel center"></section></main>
<script>
const students=[
{full:'ANA RAFAELA JACOB FERREIRA',first:'ANA RAFAELA'},{full:'ANTONELA GRANADO FERREIRA DA SILVA',first:'ANTONELA'},{full:'BENICIO JOFRE BUENO',first:'BENICIO'},{full:'EDSON FILHO DOS SANTOS CARVALHO',first:'EDSON'},{full:'GABRIEL GONÇALVES MARCELINO',first:'GABRIEL'},{full:'ISIS ELIZABETH ANACRETO SETTI',first:'ISIS'},{full:'MARIA LUIZA TICCHINI DA CRUZ',first:'MARIA LUIZA'},{full:'RAQUEL FIUZA DAMIÃO',first:'RAQUEL'},{full:'VALENTINA FIGUEIREDO PULCINELLI',first:'VALENTINA'},{full:'HELENA SIMÕES ALVES',first:'HELENA'}];
const levels=[
{title:'Conhecendo o robô',rows:1,cols:3,start:[0,0,'E'],targets:[[0,2]],blocks:[],allow:['F','B'],hint:'Faça o robô andar até a luz e depois ACENDER.'},
{title:'Mais um passo',rows:1,cols:4,start:[0,0,'E'],targets:[[0,3]],blocks:[],allow:['F','B'],hint:'Conte quantos passos o robô precisa dar.'},
{title:'Duas luzes',rows:1,cols:5,start:[0,0,'E'],targets:[[0,2],[0,4]],blocks:[],allow:['F','B'],hint:'Acenda a primeira luz e continue até a segunda.'},
{title:'Primeira curva',rows:2,cols:4,start:[1,0,'E'],targets:[[1,3],[0,3]],blocks:[],allow:['F','L','B'],hint:'Depois de acender a primeira luz, vire para cima.'},
{title:'Caminho em L',rows:3,cols:3,start:[2,0,'E'],targets:[[2,2],[0,2]],blocks:[],allow:['F','L','B'],hint:'Avance, acenda, vire e continue.'},
{title:'Virando para a direita',rows:3,cols:3,start:[0,0,'S'],targets:[[2,0],[2,2]],blocks:[],allow:['F','L','R','B'],hint:'Agora você também pode virar para a direita.'},
{title:'Três luzes',rows:3,cols:4,start:[2,0,'E'],targets:[[2,3],[1,3],[0,3]],blocks:[],allow:['F','L','B'],hint:'As três luzes estão no mesmo caminho.'},
{title:'Desviando da pedra',rows:3,cols:4,start:[2,0,'E'],targets:[[0,3]],blocks:[[2,2],[1,2]],allow:['F','L','R','B'],hint:'A pedra bloqueia o caminho. Encontre outra rota.'},
{title:'Zigue-zague',rows:4,cols:4,start:[3,0,'E'],targets:[[3,1],[1,1],[1,3]],blocks:[[2,0],[2,2],[0,1]],allow:['F','L','R','B'],hint:'Planeje o caminho antes de executar.'},
{title:'Contorno',rows:4,cols:5,start:[3,0,'E'],targets:[[3,4],[0,4]],blocks:[[3,2],[2,2],[1,2]],allow:['F','L','R','B'],hint:'Dê a volta no obstáculo.'},
{title:'Primeira repetição',rows:1,cols:6,start:[0,0,'E'],targets:[[0,5]],blocks:[],allow:['F','B','R2'],hint:'Use ×2 ÚLTIMO para repetir o último comando.'},
{title:'Repetindo três vezes',rows:1,cols:7,start:[0,0,'E'],targets:[[0,3],[0,6]],blocks:[],allow:['F','B','R3'],hint:'Use ×3 ÚLTIMO para economizar comandos.'},
{title:'Quadrado de luzes',rows:3,cols:3,start:[2,0,'E'],targets:[[2,2],[0,2],[0,0]],blocks:[],allow:['F','L','R','B','R2'],hint:'Acenda as três quinas.'},
{title:'Desafio do labirinto',rows:5,cols:5,start:[4,0,'E'],targets:[[4,4],[2,4],[0,4]],blocks:[[3,2],[1,2],[2,1]],allow:['F','L','R','B','R2'],hint:'Há obstáculos. Teste e corrija se precisar.'},
{title:'Missão final',rows:5,cols:6,start:[4,0,'E'],targets:[[4,3],[2,5],[0,3],[0,0]],blocks:[[3,2],[3,4],[1,1],[1,4]],allow:['F','L','R','B','R2','R3'],hint:'Use tudo o que aprendeu para acender todas as luzes.'}
];
let student=null,phase=-1,stars=0,tries=0,prog=[],busy=false,lit=new Set(),bot=null,startTime=0,report=[];
const labels={F:'⬆️ AVANÇAR',L:'↶ ESQ.',R:'↷ DIR.',B:'💡 ACENDER',R2:'×2 ÚLTIMO',R3:'×3 ÚLTIMO'}; const app=document.getElementById('app');
function norm(s){return(s||'').trim().toUpperCase().replace(/\s+/g,' ')}
function stats(){phaseN.textContent=Math.max(1,phase+1);starsEl.textContent=stars;triesEl.textContent=tries;bar.style.width=(phase<0?0:(phase+1)/levels.length*100)+'%'}
function fb(m,ok){const e=document.getElementById('feedback');if(e){e.className='feedback '+(ok?'ok':'bad');e.textContent=m}}
function startScreen(){app.innerHTML=`<h2>Colégio Universitas — 1º Ano</h2><div class="lead">Escolha seu nome e depois digite o mesmo primeiro nome.</div><div class="studentGrid">${students.map((s,i)=>`<button class="student" onclick="pick(${i},this)">${s.first}</button>`).join('')}</div><input id="nameInput" placeholder="DIGITE SEU PRIMEIRO NOME"><div class="actions"><button class="btn green" onclick="start()">COMEÇAR ▶</button></div><div id="feedback" class="feedback"></div>`;stats()}
function pick(i,b){student=students[i];document.querySelectorAll('.student').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function start(){if(!student){fb('Selecione seu nome.',false);return}const v=norm(nameInput.value);if(v!==norm(student.first)&&v!==norm(student.full)){fb('Digite o mesmo nome selecionado.',false);return}phase=0;startTime=Date.now();load()}
function load(){const L=levels[phase];prog=[];lit=new Set();bot={r:L.start[0],c:L.start[1],d:L.start[2]};stats();render()}
function render(){const L=levels[phase];app.className='panel';app.innerHTML=`<h2>Fase ${phase+1} — ${L.title}</h2><div class="lead">${L.hint}</div><div class="gamegrid"><div><div class="boardWrap"><div class="board" id="board"></div></div></div><div class="side"><b>COMANDOS</b><div class="cmdButtons" id="cmdButtons"></div><div class="program" id="program"></div><div class="actions"><button class="btn green" onclick="run()">▶ EXECUTAR</button><button class="btn yellow" onclick="del()">⌫ APAGAR</button><button class="btn light" onclick="clearP()">LIMPAR</button></div><div class="help">AVANÇAR move o robô uma casa. ESQ. e DIR. mudam a direção. ACENDER liga a luz. ×2 e ×3 repetem o último comando.</div><div id="feedback" class="feedback"></div></div></div>`;buttons();renderProg();draw()}
function buttons(){cmdButtons.innerHTML='';levels[phase].allow.forEach(c=>{const b=document.createElement('button');b.className='cmd';b.textContent=labels[c];b.onclick=()=>{prog.push(c);renderProg()};cmdButtons.appendChild(b)})}
function renderProg(){program.innerHTML=prog.length?'':'Nenhum comando.';prog.forEach(c=>{const s=document.createElement('span');s.className='token '+(c[0]==='R'?'rep':'');s.textContent=labels[c];program.appendChild(s)})}
function del(){prog.pop();renderProg()} function clearP(){prog=[];renderProg()}
function k(r,c){return r+','+c} function block(r,c){return levels[phase].blocks.some(x=>x[0]===r&&x[1]===c)} function target(r,c){return levels[phase].targets.some(x=>x[0]===r&&x[1]===c)}
function draw(){const L=levels[phase];board.style.gridTemplateColumns=`repeat(${L.cols},70px)`;board.innerHTML='';for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++){const e=document.createElement('div');e.className='cell';if(block(r,c))e.classList.add('block');if(!block(r,c)&&target(r,c)){const t=document.createElement('div');t.className='target'+(lit.has(k(r,c))?' on':'');e.appendChild(t)}if(bot.r===r&&bot.c===c){const q=document.createElement('span');q.className='robot';q.textContent={N:'⬆️',E:'➡️',S:'⬇️',W:'⬅️'}[bot.d];e.appendChild(q)}board.appendChild(e)}}
function turn(s){const d=['N','E','S','W'];let i=d.indexOf(bot.d);bot.d=d[(i+(s==='R'?1:3))%4]}
function next(){const d={N:[-1,0],E:[0,1],S:[1,0],W:[0,-1]}[bot.d];return[bot.r+d[0],bot.c+d[1]]}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function atom(c){const L=levels[phase];if(c==='L'||c==='R'){turn(c);draw();await wait(170);return true}if(c==='B'){if(target(bot.r,bot.c)){lit.add(k(bot.r,bot.c));draw();await wait(170);return true}fb('O robô tentou acender fora de uma luz.',false);return false}if(c==='F'){const[nr,nc]=next();if(nr<0||nc<0||nr>=L.rows||nc>=L.cols||block(nr,nc)){fb('O robô bateu ou saiu do caminho.',false);return false}bot.r=nr;bot.c=nc;draw();await wait(170);return true}return true}
async function execute(){let last=null;for(const c of prog){if(c==='R2'||c==='R3'){if(!last){fb('A repetição precisa de um comando antes.',false);return false}for(let i=0;i<(c==='R2'?1:2);i++)if(!await atom(last))return false;continue}if(!await atom(c))return false;if(['F','L','R','B'].includes(c))last=c}return true}
async function run(){if(busy)return;busy=true;tries++;stats();const L=levels[phase];bot={r:L.start[0],c:L.start[1],d:L.start[2]};lit=new Set();draw();const ok=await execute();busy=false;if(!ok)return;const done=L.targets.every(t=>lit.has(k(t[0],t[1])));if(done){stars++;report.push({fase:phase+1,titulo:L.title,tempo:Math.round((Date.now()-startTime)/1000)});fb('Fase concluída!',true);stats();setTimeout(()=>{phase++;if(phase>=levels.length)finish();else{startTime=Date.now();load()}},700)}else fb('Ainda existem luzes apagadas.',false)}
function finish(){bar.style.width='100%';app.className='panel center';app.innerHTML=`<div class="final"><div style="font-size:64px">🏆</div><h2>MISSÃO CONCLUÍDA!</h2><div class="lead">${student.full}, você completou as 15 fases do Robozinho Universitas!</div><p><b>Estrelas:</b> ${stars} • <b>Tentativas:</b> ${tries}</p></div><div class="actions"><button class="btn green" onclick="window.print()">IMPRIMIR RELATÓRIO</button><button class="btn light" onclick="location.reload()">JOGAR NOVAMENTE</button></div><table><thead><tr><th>Fase</th><th>Desafio</th><th>Tempo</th></tr></thead><tbody>${report.map(x=>`<tr><td>${x.fase}</td><td>${x.titulo}</td><td>${x.tempo}s</td></tr>`).join('')}</tbody></table>`}
startScreen();
</script></body></html>
